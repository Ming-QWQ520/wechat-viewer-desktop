name: Build Windows Desktop

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go helper tools (key extractor / image checker)
        run: |
          Push-Location tools/keyextract-src
          go build -trimpath -o ..\wechat-keys.exe .
          Pop-Location
          Push-Location tools/imgcheck-src
          go build -trimpath -o ..\imgcheck.exe .
          Pop-Location

      - name: Build SILK voice decoder (mingw gcc)
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc -ErrorAction SilentlyContinue).Source
          if (-not $gcc) { $gcc = "C:\msys64\mingw64\bin\gcc.exe" }
          Write-Host "using gcc: $gcc"
          & $gcc --version
          if ($LASTEXITCODE -ne 0) { throw "gcc not available" }
          $sources = Get-ChildItem "tools\silk\src" -Filter *.c | ForEach-Object { $_.FullName }
          & $gcc -O2 -w -static -I tools\silk\interface -I tools\silk\src @sources tools\silk\test\Decoder.c -o tools\silkdec.exe -lm
          if ($LASTEXITCODE -ne 0) { throw "SILK decoder build failed" }
          Get-Item tools\silkdec.exe | Select-Object Name, Length

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WeChatViewer.Desktop\WeChatViewer.Desktop.csproj -p:Platform=x64

      - name: Publish (self-contained, unpackaged)
        run: >
          dotnet publish WeChatViewer.Desktop\WeChatViewer.Desktop.csproj
          -c Release
          -p:Platform=x64
          -p:PublishProfile=win-x64
          -p:WindowsAppSDKSelfContained=true
          -p:SelfContained=true

      - name: Verify output
        shell: pwsh
        run: |
          $out = "WeChatViewer.Desktop\bin\publish\win-x64"
          if (-not (Test-Path $out)) {
            Write-Host "Publish dir not found, searching..."
            $exe = Get-ChildItem -Recurse -Filter "WeChatViewer.Desktop.exe" | Select-Object -First 1
            if (-not $exe) { throw "build output missing" }
            $out = $exe.DirectoryName
            Write-Host "Found output at $out"
          }
          $files = Get-ChildItem $out -Recurse -File
          Write-Host "Output: $out"
          Write-Host ("Total files: {0}  |  Top-level items: {1}" -f $files.Count, (Get-ChildItem $out).Count)
          Get-ChildItem $out -Filter *.exe | Select-Object Name
          if (-not (Test-Path "$out\tools\wechat-keys.exe")) { Write-Warning "tools\wechat-keys.exe missing" }
          if (-not (Test-Path "$out\tools\silkdec.exe")) { Write-Warning "tools\silkdec.exe missing" }

      - name: Smoke test silkdec (decode a real SILK sample)
        shell: pwsh
        run: |
          # Validates the shipped silkdec.exe end-to-end: static linking + decoder correctness.
          # A broken exe (e.g. missing mingw runtime DLLs) would fail here instead of on user machines.
          $exe = "tools\silkdec.exe"
          $sample = "tools\silk\test\wechat_silk_sample.bin"   # 0x02 + "#!SILK_V3" + 1s of 440Hz @24kHz
          $pcm = Join-Path $env:TEMP "smoke_voice.pcm"
          Remove-Item $pcm -ErrorAction SilentlyContinue
          & $exe $sample $pcm -Fs_API 24000 -quiet | Write-Host
          if (-not (Test-Path $pcm)) { throw "silkdec produced no PCM" }
          $len = (Get-Item $pcm).Length
          Write-Host "silkdec smoke PCM: $len bytes"
          if ($len -lt 40000) { throw "silkdec PCM too small: $len bytes (expected ~48000 for 1s @24kHz 16-bit)" }
          Remove-Item $pcm -ErrorAction SilentlyContinue

      - name: Smoke test (launch the app and verify it stays alive)
        shell: pwsh
        run: |
          $out = "WeChatViewer.Desktop\bin\publish\win-x64"
          $exe = Join-Path $out "WeChatViewer.Desktop.exe"
          if (-not (Test-Path $exe)) { throw "exe missing: $exe" }
          Write-Host "Launching $exe ..."
          $p = Start-Process -FilePath $exe -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 30
          # dump app log no matter what
          if (Test-Path "$out\logs") {
            Get-ChildItem "$out\logs" -File | ForEach-Object {
              Write-Host "----- $($_.Name) -----"
              Get-Content $_.FullName
            }
          } else { Write-Host "(no logs written - likely blocked before Main)" }
          # fail on early exit
          if ($p.HasExited) {
            Write-Host "::error::APP EXITED EARLY, exit code = $($p.ExitCode)"
            exit 1
          }
          # fail if the startup log contains a fatal marker
          # (a fatal-error MessageBox keeps the process alive on CI - do not trust liveness alone)
          $logText = Get-ChildItem "$out\logs" -File -ErrorAction SilentlyContinue |
            Get-Content -ErrorAction SilentlyContinue | Out-String
          $markers = @("启动失败", "失败:", "未处理异常", "致命错误", "Exception")
          foreach ($m in $markers) {
            if ($logText -match [regex]::Escape($m)) {
              Write-Host "::error::Startup log contains failure marker: $m"
              try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
              exit 1
            }
          }
          Write-Host "App is alive after 30s and log is clean -> window started OK"
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}

      - name: Read app version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content "WeChatViewer.Desktop\WeChatViewer.Desktop.csproj"
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $v) { throw "Version missing in csproj" }
          Write-Output "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "App version: $v"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # ensure UTF-8 BOM so Inno reads the Chinese strings correctly
          $iss = "installer\installer.iss"
          $c = Get-Content $iss -Raw
          [IO.File]::WriteAllText((Resolve-Path $iss).Path, $c, (New-Object Text.UTF8Encoding $true))
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not found, installing via choco..."
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still missing" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DPublishDir="..\WeChatViewer.Desktop\bin\publish\win-x64" $iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Collect portable zip
        shell: pwsh
        run: |
          $out = "WeChatViewer.Desktop\bin\publish\win-x64"
          $stage = "dist\portable\WeChatViewer.Desktop"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $src = (Resolve-Path $out).Path
          Get-ChildItem $src -Recurse -File | Where-Object {
            $_.Extension -ne ".pdb" -and $_.FullName -notmatch '\\logs(\\|$)'
          } | ForEach-Object {
            $rel = $_.FullName.Substring($src.Length + 1)
            $dst = Join-Path $stage $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $_.FullName $dst -Force
          }
          $zipName = "WeChatViewer.Desktop-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path "dist\portable\WeChatViewer.Desktop" -DestinationPath "dist\$zipName" -Force
          Remove-Item "dist\portable" -Recurse -Force
          $zip = Get-Item "dist\$zipName"
          Write-Host ("Portable zip: {0}  ({1} MB)" -f $zip.Name, [math]::Round($zip.Length/1MB,1))
          Get-ChildItem dist | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatViewer.Desktop-${{ steps.ver.outputs.version }}-win-x64
          path: dist/*
          if-no-files-found: error

      - name: Release (tag v${{ steps.ver.outputs.version }})
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: WeChatViewer Desktop ${{ steps.ver.outputs.version }}
          body: |
            ### 下载说明
            - **WeChatViewer-Setup-${{ steps.ver.outputs.version }}-win-x64.exe**：安装版（推荐）。双击安装，自动创建开始菜单与桌面快捷方式，卸载干净。
            - **WeChatViewer.Desktop-${{ steps.ver.outputs.version }}-win-x64.zip**：绿色版。解压后运行 WeChatViewer.Desktop.exe。
            > WinUI 3 应用的 .NET / WinUI 运行库文件必须与 exe 位于同一目录（官方限制），绿色版无法合并为单个 exe，推荐使用安装版。
          files: |
            dist/WeChatViewer-Setup-${{ steps.ver.outputs.version }}-win-x64.exe
            dist/WeChatViewer.Desktop-${{ steps.ver.outputs.version }}-win-x64.zip
          fail_on_unmatched_files: true
